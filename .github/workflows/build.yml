name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # ✅ CORRECTION PRINCIPALE : forcer Java 17 pour Gradle
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          java-package: jdk

      - name: Vérifier la version de Java
        run: |
          java -version
          echo "JAVA_HOME=$JAVA_HOME"

      - name: Installer les dépendances système
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk python3-pip \
            autoconf libtool pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev libtinfo5 \
            cmake libffi-dev libssl-dev aidl \
            automake

      - name: Installer Buildozer et Cython
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade buildozer cython virtualenv

      - name: Mettre en cache les téléchargements Buildozer
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            ~/.gradle
          key: buildozer-${{ runner.os }}-v2-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-${{ runner.os }}-

      - name: Nettoyer le cache Gradle
        run: |
          rm -rf ~/.gradle/caches/ || true

      - name: Construire l'APK avec Buildozer
        run: |
          yes | buildozer -v android debug 2>&1 | tee build.log
        continue-on-error: true

      - name: Extraire les erreurs Gradle
        if: always()
        run: |
          echo "==================== WHAT WENT WRONG ===================="
          grep -n -A15 "What went wrong" build.log | head -50 || echo "(aucune section 'What went wrong')"
          echo "==================== TÂCHES ÉCHOUÉES ===================="
          grep -n -A10 "Execution failed for task" build.log | head -40 || echo "(aucune tâche échouée détectée)"

      - name: Uploader le log de build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7

      - name: Uploader l'APK (si build réussi)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: pharmacie-apk
          path: bin/*.apk
          retention-days: 30
